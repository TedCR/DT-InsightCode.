<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13265f"/>
      <stop offset="0.55" stop-color="#0f205f"/>
      <stop offset="1" stop-color="#0a1640"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#059668"/>
      <stop offset="1" stop-color="#34d39e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- Barras decorativas tenues (esquina inferior derecha) -->
  <g opacity="0.10">
    <rect x="760" y="820" width="60" height="150" rx="12" fill="#34d39e"/>
    <rect x="845" y="740" width="60" height="230" rx="12" fill="#34d39e"/>
    <rect x="930" y="650" width="60" height="320" rx="12" fill="#34d39e"/>
  </g>

  <!-- Eyebrow -->
  <g>
    <circle cx="112" cy="150" r="11" fill="#34d39e"/>
    <text x="138" y="160" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="34" letter-spacing="4" fill="#34d39e">NUEVO EN GUANACASTE</text>
  </g>

  <!-- Titular -->
  <text x="100" y="380" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="104" fill="#ffffff">Tecnología y</text>
  <text x="100" y="500" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="104" fill="#ffffff">datos para</text>
  <text x="100" y="620" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="104" fill="#34d39e">crecer tu negocio</text>

  <!-- Subtitulo -->
  <text x="104" y="710" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="40" fill="#cbd5e1">Sitios web · Dashboards · Sistemas a la medida</text>

  <!-- Linea divisoria -->
  <rect x="104" y="770" width="872" height="3" rx="1.5" fill="#1f3a7a"/>

  <!-- Pie: marca + CTA -->
  <g>
    <!-- mini icono -->
    <rect x="104" y="900" width="84" height="84" rx="20" fill="#0a1640" stroke="#22356f" stroke-width="2"/>
    <rect x="120" y="945" width="14" height="24" rx="4" fill="url(#bars)"/>
    <rect x="139" y="932" width="14" height="37" rx="4" fill="url(#bars)"/>
    <rect x="158" y="918" width="14" height="51" rx="4" fill="url(#bars)"/>
    <text x="208" y="945" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="46" fill="#ffffff">DT<tspan fill="#34d39e">.</tspan> InsightCode</text>
    <text x="208" y="985" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="30" fill="#94a3b8">Asesoría gratis · WhatsApp +506 7229 6460</text>
  </g>
</svg>
